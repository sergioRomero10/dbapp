<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--
  xmlns:th → Namespace de Thymeleaf, permite usar th:text, th:each, th:src, etc.
  xmlns:sec → Namespace de Spring Security, permite mostrar contenido según autenticación o roles.
-->
<head>
<meta charset="UTF-8">
<title>Personajes Dragon Ball</title>
<link rel="stylesheet" th:href="@{/css/stylepersonajes.css}">
</head>

<body>
	<!-- =======================
     Navbar
     ======================= -->
	<nav class="navbar">
		<div class="navbar-container">
			<a href="/" class="logo">DRAGON BALL // SCANNER</a>
			<ul class="nav-links">

				<li sec:authorize="isAuthenticated()"><span> <strong
						th:text="${#authentication.name}"></strong>
				</span> <a th:href="@{/logout}">Cerrar Sesión</a></li>

				<li sec:authorize="!isAuthenticated()"><a href="/login">Iniciar
						Sesión</a></li>

				<li class="active"><a href="/vista/personajesweb">Personajes</a></li>

				<li><a href="/vista/favoritos">Favoritos</a></li>

				<li><a href="/vista/sobres">🎁 Abrir sobre</a></li>

				<li><a href="#">Acerca de</a></li>

			</ul>
		</div>
	</nav>

	<h1>Base de datos de guerreros</h1>

	<!-- =======================
     Cards de Personajes
     ======================= -->
	<div class="container">
		<!-- Iteramos la lista de personajes desde el controller -->
		<div class="card"
			th:each="p : ${personajes}"
			th:with="raceClass=${
				p.race == 'Saiyan' ? 'race-saiyan' :
				(p.race == 'Namekian' ? 'race-namekian' :
				(p.race == 'Human' ? 'race-human' :
				(p.race == 'Android' ? 'race-android' :
				(p.race == 'Frieza Race' ? 'race-frieza' :
				(p.race == 'God' ? 'race-god' :
				(p.race == 'Majin' ? 'race-majin' : 'race-other'))))))}"
			th:classappend="${raceClass}"
			th:data-ki="${p.ki}">

			<div class="card-image">
				<span class="race-tag" th:text="${p.race}"></span>
				<img th:src="${p.image}" alt="Imagen de personaje" />
			</div>

			<div class="card-data">
				<div class="card-info">
					<h3 th:text="${p.name}"></h3>
					<p>
						<strong>Género</strong> <span th:text="${p.gender}"></span>
					</p>
					<p>
						<strong>Afiliación</strong> <span th:text="${p.affiliation}"></span>
					</p>

					<div class="power-wrap">
						<div class="power-label">
							<span>KI BASE</span>
							<span th:text="${p.ki}"></span>
						</div>
						<div class="power-bar">
							<div class="power-bar-fill"></div>
						</div>
					</div>

					<div class="power-wrap">
						<div class="power-label">
							<span>KI MÁXIMO</span>
							<span th:text="${p.maxKi}"></span>
						</div>
						<div class="power-bar">
							<div class="power-bar-fill" data-max="true"></div>
						</div>
					</div>
				</div>

				<div class="card-buttons">
					<!-- Corazón solo para usuarios autenticados -->
					<span sec:authorize="isAuthenticated()" class="corazon"
						th:data-id="${p.id}"
						th:text="${favoritosIds.contains(p.id) ? '❤️' : '🤍'}"> </span>
					<a th:href="@{/vista/personajesweb/{id}(id=${p.id})}"
						class="btn-detalle">MÁS INFO</a>
				</div>
			</div>
		</div>
	</div>

	<!-- =======================
     Script para Favoritos
     ======================= -->
	<script>
document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.corazon').forEach(corazon => {
        corazon.addEventListener('click', function() {
            const personajeId = this.getAttribute('data-id');
            if (!personajeId) return;

            // Determina si ya es favorito
            const esFavorito = this.textContent === '❤️';
            const url = esFavorito
                ? `/favorito/quitar/${personajeId}`
                : `/favorito/agregar/${personajeId}`;

            fetch(url, { method: 'GET' }) // Nota: idealmente POST para seguridad
                .then(response => {
                    if (response.ok) {
                        this.textContent = esFavorito ? '🤍' : '❤️';
                    } else {
                        console.error('Error en la petición');
                    }
                })
                .catch(err => console.error(err));
        });
    });
});
</script>

	<!-- =======================
     Script: barras de poder (KI)
     Calcula el KI de cada personaje y anima la barra
     en relación al KI más alto visible en la página.
     ======================= -->
	<script>
document.addEventListener('DOMContentLoaded', function() {

    function parseKi(texto) {
        if (!texto) return 0;
        const limpio = String(texto).replace(/[^0-9]/g, '');
        return limpio ? parseInt(limpio, 10) : 0;
    }

    const cards = document.querySelectorAll('.card');

    // Sacamos el ki y maxKi maximos visibles para escalar las barras
    let maxKiGlobal = 0;
    let maxKiMaxGlobal = 0;

    cards.forEach(card => {
        const kiValor = parseKi(card.dataset.ki);
        if (kiValor > maxKiGlobal) maxKiGlobal = kiValor;

        const maxKiSpan = card.querySelector('.power-wrap:nth-of-type(2) .power-label span:last-child');
        const maxKiValor = maxKiSpan ? parseKi(maxKiSpan.textContent) : 0;
        if (maxKiValor > maxKiMaxGlobal) maxKiMaxGlobal = maxKiValor;
    });

    // Animamos cada barra con un pequeño desfase por tarjeta
    cards.forEach((card, index) => {
        const kiValor = parseKi(card.dataset.ki);
        const bars = card.querySelectorAll('.power-bar-fill');

        const maxKiSpan = card.querySelector('.power-wrap:nth-of-type(2) .power-label span:last-child');
        const maxKiValor = maxKiSpan ? parseKi(maxKiSpan.textContent) : 0;

        const pctKi = maxKiGlobal > 0 ? Math.max(4, (kiValor / maxKiGlobal) * 100) : 4;
        const pctMaxKi = maxKiMaxGlobal > 0 ? Math.max(4, (maxKiValor / maxKiMaxGlobal) * 100) : 4;

        setTimeout(() => {
            if (bars[0]) bars[0].style.width = pctKi + '%';
            if (bars[1]) bars[1].style.width = pctMaxKi + '%';
        }, 80 * (index % 8));
    });
});
</script>

</body>
</html>
